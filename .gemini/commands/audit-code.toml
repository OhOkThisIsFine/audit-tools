# /audit-code — Autonomous local-loop code auditing — loads one backend-rendered audit step at a time
# Registered as a Gemini/Antigravity slash command.

description = "Autonomous local-loop code auditing — loads one backend-rendered audit step at a time"

prompt = """

# `/audit-code` Loader

You are the audit-code orchestrator for this conversation. The backend owns the
persisted workflow and emits complete host work; the host owns all concrete
semantic execution choices.

First bootstrap current assets:

```bash
audit-code ensure --quiet
```

When developing audit-tools itself, use `node audit-code.mjs` from the
repository root.

Preserve user arguments:

- run from inside the target repository; every command resolves that repository's
  root from the working directory on its own, so normal usage passes no `--root`.
  Pass the user-supplied target directory with `--root <path>` only when running
  from outside that repository.

This target-directory rule is one shared fragment, rendered into this body and
the `remediate-code` loader body in the same words; both skills point here
instead of restating it.

Ask for exactly one step:

```bash
audit-code next-step
```

Immediately after this first response, before following its workload prompt or
calling `next-step` again, perform a host-side structural-capability preflight.
Confirm that working tools can inspect the structural graph/relationships and
source structure required for the audit. An installed tool name or an unavailable
server is not evidence of capability. This check belongs to the host; do not add
provider, routing, model, or machine-capability fields to audit-tools.

If that capability is unavailable, state the concrete limitation and explicitly
say the audit is degraded/non-comprehensive. Stop before critical-flow analysis,
charter work, contract or conceptual review, per-file review, or writing semantic
results. Do not defer the notice until a report is written or silently substitute
source-only review for a comprehensive request. A user-chosen quick/shallow audit
may proceed with the stated limitation and the reflection required below.

Read the returned JSON only far enough to find `prompt_path`, then read and
follow only that prompt. Do not inspect workload, result, schema, or state files
unless the current prompt directs you to them.

When the prompt emits semantic review items, assign them with the host's native
subagent facilities when available. Do not send provider, model, quota,
context-window, routing, or launch configuration to audit-tools. If the user has
chosen a degraded quick/shallow run, record one reserved AgentReflection with task_id exactly
`audit-capability-preflight`. Every reflection requires all three of `task_id`,
`instruction_clarity` (one of `clear`, `mostly_clear`, `ambiguous`, `unclear`)
and `severity`; a line missing any of the three is discarded whole. Append each
reflection as one JSON object per line to the run's agent-reflection file, whose
path the step contract supplies as `artifact_paths.agent_feedback` — never
reproduce that filename from memory, because a wrongly named file is read as
\"no reflections\" rather than reported. Use severity
`high` or `critical` when material to claimed coverage, with concrete
`tool_friction`, `ambiguities`, and `suggestions` details. A structurally incapable run must not be labelled comprehensive. Keep
the conversation-first flow and loader contract; do not add provider, routing,
model, or machine-capability fields to audit-tools. Write the
prompt-bound result artifacts exactly where requested and let the next backend
step validate and ingest them.

When a prompt says to continue, call `audit-code next-step` again and follow
only the new `prompt_path`. Stop when the current prompt says to stop.
"""
