name: publish-package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip actual publish)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      publish_tag:
        description: "npm dist-tag override"
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "latest"
          - "next"
          - "beta"
          - "rc"
  release:
    types: [published]

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_NODE_VERSION: "22.14.0"
  NPM_CONFIG_LOGLEVEL: notice

permissions:
  contents: read

jobs:
  # Capture one immutable source before qualification; metadata is not ancestry.
  validate-source:
    if: |
      (github.event_name == 'release' && startsWith(github.ref_name, 'v')) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Checkout captured event commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - name: Validate release source
        id: source
        shell: bash
        env:
          RELEASE_EVENT_SHA: ${{ github.sha }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node scripts/shared/verify-release-source.mjs

  # The release gate is split into two parallel job classes so the publish path
  # is bounded by the SLOWEST gate job rather than the SUM of every step:
  #   - `gate`  : the cheap deterministic chain (check, deadcode, doc-manifest,
  #               build, host verifies, packaged smokes) — seconds of wall-clock.
  #   - `test`  : the vitest suite, sharded N ways across parallel runners. vitest
  #               is ~93% of the old serial gate; sharding it is the only lever
  #               that materially cuts release latency.
  # `publish` needs both, so a failure in any shard or the cheap chain blocks the
  # upload exactly as the former monolithic `verify:release` step did.
  gate:
    needs: [validate-source]
    if: |
      (github.event_name == 'release' && startsWith(github.ref_name, 'v')) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      tarball_sha256: ${{ steps.tarball.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v4
        with:
          ref: ${{ needs.validate-source.outputs.commit }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit --no-fund
      - name: Verify release checks (non-test gate)
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::npm run verify:checks failed."' ERR
          AUDIT_TOOLS_RELEASE_PACK_DIR=$(mktemp -d "$RUNNER_TEMP/npm-release-pack.XXXXXX")
          export AUDIT_TOOLS_RELEASE_PACK_DIR
          echo "AUDIT_TOOLS_RELEASE_PACK_DIR=$AUDIT_TOOLS_RELEASE_PACK_DIR" >> "$GITHUB_ENV"
          npm run verify:checks
      - name: Identify the smoke-qualified tarball
        id: tarball
        shell: bash
        run: |
          set -euo pipefail
          tarball=$(node scripts/shared/smoke-tarball.mjs --verify-release)
          digest=$(sha256sum "$tarball")
          echo "path=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
          printf '### Qualified npm tarball\n- SHA-256: %s\n' "${digest%% *}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the smoke-qualified tarball
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-npm-tarball-${{ github.run_attempt }}
          path: ${{ steps.tarball.outputs.path }}
          if-no-files-found: error
          compression-level: 0

  test:
    needs: [validate-source]
    if: |
      (github.event_name == 'release' && startsWith(github.ref_name, 'v')) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Keep the denominator in the `vitest run --shard` command below in sync
      # with the length of this list.
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v4
        with:
          ref: ${{ needs.validate-source.outputs.commit }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit --no-fund
      - name: Build
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          npm run build
      - name: Run tests (shard ${{ matrix.shard }}/4)
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::vitest shard ${{ matrix.shard }}/4 failed."' ERR
          # run-vitest-gate.mjs, not a bare `npx vitest run` — closes the false-green
          # defect (docs/backlog.md, search false-green): it fails nonzero if the
          # ledger's structured outcome reports failures even when vitest's own
          # process exit code is 0.
          node scripts/shared/run-vitest-gate.mjs --shard=${{ matrix.shard }}/4

      - name: Upload vitest shard ledger
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-package-vitest-ledger-shard-${{ matrix.shard }}
          path: .audit-tools-profile/vitest-shard${{ matrix.shard }}of4-latest.json
          if-no-files-found: ignore

  publish:
    needs: [validate-source, gate, test]
    # Single package `audit-tools`: release tags are plain `vX.Y.Z`.
    if: |
      (github.event_name == 'release' && startsWith(github.ref_name, 'v')) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v4
        with:
          ref: ${{ needs.validate-source.outputs.commit }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Recheck verified release source
        shell: bash
        env:
          RELEASE_EVENT_SHA: ${{ github.sha }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          VERIFIED_RELEASE_SHA: ${{ needs.validate-source.outputs.commit }}
        run: |
          node scripts/shared/verify-release-source.mjs
      - name: Download the smoke-qualified tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.gate.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/qualified-npm-tarball
      - name: Verify the tarball bytes and package identity
        shell: bash
        env:
          QUALIFIED_SHA256: ${{ needs.gate.outputs.tarball_sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=("$RUNNER_TEMP/qualified-npm-tarball/"*.tgz)
          [[ ${#tarballs[@]} -eq 1 ]]
          tarball=${tarballs[0]}
          echo "$QUALIFIED_SHA256  $tarball" | sha256sum --check --strict
          tar -xOzf "$tarball" package/package.json | node -e '
            const fs = require("node:fs");
            const packed = JSON.parse(fs.readFileSync(0, "utf8"));
            const source = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (packed.name !== source.name || packed.version !== source.version) {
              throw new Error("Qualified tarball does not match the verified package name and version.");
            }
          '
          echo "RELEASE_TARBALL=$tarball" >> "$GITHUB_ENV"
      - name: Upgrade npm for trusted publishing
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11.5.1 --ignore-scripts
      - name: Resolve publish metadata
        id: publish_meta
        timeout-minutes: 2
        shell: bash
        env:
          INPUT_PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          set -euo pipefail
          PACKAGE_NAME=$(node -e "process.stdout.write(require('./package.json').name)")
          PACKAGE_VERSION=$(node -e "process.stdout.write(require('./package.json').version)")
          if [[ -n "$INPUT_PUBLISH_TAG" && "$INPUT_PUBLISH_TAG" != "auto" ]]; then
            PUBLISH_TAG="$INPUT_PUBLISH_TAG"
          elif [[ "$PACKAGE_VERSION" == *-* ]]; then
            PUBLISH_TAG="next"
          else
            PUBLISH_TAG="latest"
          fi
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "publish_tag=$PUBLISH_TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved: ${PACKAGE_NAME}@${PACKAGE_VERSION} -> ${PUBLISH_TAG}"
          MODE="live"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            MODE="dry-run"
          fi
          {
            echo "### Publish plan"
            echo "- package: ${PACKAGE_NAME}@${PACKAGE_VERSION}"
            echo "- dist-tag: ${PUBLISH_TAG}"
            echo "- mode: ${MODE}"
            echo "- Node: ${{ env.RELEASE_NODE_VERSION }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preview packed tarball contents
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          tar -tzf "$RELEASE_TARBALL"
      - name: Publish to npm (trusted publishing / tokenless OIDC)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == 'false' }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::npm publish failed. Confirm npm Trusted Publishing is configured for publish-package.yml in OhOkThisIsFine/audit-tools."' ERR
          # Publish the artifact installed by both packaged smokes, not this checkout.
          BACKOFF_SECONDS=(5 15)
          for attempt in 1 2 3; do
            if output=$(npm publish "$RELEASE_TARBALL" --ignore-scripts --access public --tag "${{ steps.publish_meta.outputs.publish_tag }}" 2>&1); then
              echo "$output"
              echo "Upload acknowledged on attempt ${attempt}; registry confirmation pending."
              exit 0
            fi
            echo "$output"
            # A version conflict alone proves neither the bytes nor the tag.
            if echo "$output" | grep -qiE '(cannot publish over|previously published|EPUBLISHCONFLICT|cannot modify pre-existing version)'; then
              echo "Version conflict on attempt ${attempt}; checking registry integrity and dist-tag."
              exit 0
            fi
            if echo "$output" | grep -qiE '(forbidden|cannot publish over|E403|you do not have permission)'; then
              echo "::error::npm publish failed with a permanent error (attempt ${attempt}). Not retrying."
              {
                echo "### Publish outcome"
                echo "- status: failed"
                echo "- package: ${{ steps.publish_meta.outputs.package_name }}@${{ steps.publish_meta.outputs.package_version }}"
                echo "- dist-tag: ${{ steps.publish_meta.outputs.publish_tag }}"
                echo "- attempts: ${attempt}"
                echo "- reason: permanent npm publish error"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if [[ "$attempt" -lt 3 ]]; then
              SLEEP="${BACKOFF_SECONDS[$(( attempt - 1 ))]}"
              echo "::warning::npm publish failed on attempt ${attempt} (transient). Retrying in ${SLEEP}s..."
              sleep "$SLEEP"
            fi
          done
          # A transport failure can hide an accepted upload, even on the last
          # attempt. Report uncertainty until the qualified registry readback.
          echo "::warning::No upload acknowledgement after 3 attempts; checking registry integrity and dist-tag."
          exit 0
      - name: Dry run publish (no upload)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          npm publish --dry-run "$RELEASE_TARBALL" --ignore-scripts --access public --tag "${{ steps.publish_meta.outputs.publish_tag }}"
          {
            echo "### Publish outcome"
            echo "- status: dry-run (no upload)"
            echo "- package: ${{ steps.publish_meta.outputs.package_name }}@${{ steps.publish_meta.outputs.package_version }}"
            echo "- dist-tag: ${{ steps.publish_meta.outputs.publish_tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm qualified registry integrity and dist-tag
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == 'false' }}
        timeout-minutes: 8
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.publish_meta.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.publish_meta.outputs.package_version }}
          PUBLISH_TAG: ${{ steps.publish_meta.outputs.publish_tag }}
        run: |
          set -euo pipefail
          echo "Verifying ${PACKAGE_NAME}@${PACKAGE_VERSION} on dist-tag ${PUBLISH_TAG}..."
          # Leave room inside the job timeout for the last bounded exact-version
          # and tag lookups and the final diagnostics.
          readback_deadline=$((SECONDS + 440))
          for attempt in {1..24}; do
            status=$(node scripts/shared/verify-release-registry.mjs)
            case "$status" in
              confirmed|integrity-mismatch|invalid-json|unexpected-json) break ;;
              pending|tag-mismatch|query-timeout|query-error)
                echo "Registry verification: $status (attempt $attempt)."
                if [[ "$attempt" -ge 24 || "$SECONDS" -ge "$readback_deadline" ]]; then break; fi
                sleep 10 ;;
              *) echo "::error::Unknown registry verification status: $status"; exit 1 ;;
            esac
          done
          {
            echo "### Registry confirmation"
            echo "- status: $status"
            echo "- package: ${PACKAGE_NAME}@${PACKAGE_VERSION}"
            echo "- dist-tag: $PUBLISH_TAG"
            echo "- attempts: $attempt"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            confirmed) exit 0 ;;
            integrity-mismatch) echo "::error::Registry integrity conflicts with the qualified tarball." ;;
            tag-mismatch) echo "::error::Requested dist-tag still points to a different version." ;;
            pending) echo "::error::Registry metadata is still missing; upload is not verified." ;;
            query-timeout|query-error) echo "::error::The npm registry readback did not complete successfully; upload is not verified." ;;
            invalid-json|unexpected-json) echo "::error::The npm registry readback response is unusable; upload is not verified." ;;
          esac
          exit 1
      - name: Upload npm debug logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-npm-logs
          path: |
            ~/.npm/_logs
            npm-debug.log*
          if-no-files-found: ignore
