name: audit-code-test-suite
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: audit-code-test-suite-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  orchestration-tests:
    name: Orchestration tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.14.0", "22", "24", "26"]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v4
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build and run contract tests
        run: npm test
